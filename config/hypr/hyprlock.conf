source=~/.config/hypr/hyprlock/colors.conf

# Keep typography stable even when matugen regenerates only the colors.
$font_family = Google Sans Flex, Noto Sans CJK TC
$font_family_clock = Google Sans Flex, Noto Sans CJK TC
$font_family_weather = Material Symbols Rounded

# Hyprlock 0.9.6's native fingerprint worker can retain the Synaptics reader
# across disconnect/suspend and leave the session impossible to unlock.  Keep
# this worker off; fingerprint is provided by the PAM stack instead.
auth {
    fingerprint {
        enabled = false
        ready_message = 輸入密碼；驗證失敗後可改用指紋
        present_message = 正在讀取指紋…
        retry_delay = 350
    }
}

background {
    path = $HOME/.local/share/backgrounds/uíos-landscape.jpg
    color = rgba(181818FF)
    blur_passes = 0
    noise = 0
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0
}
input-field {
    monitor =
    size = 480, 86
    outline_thickness = 5
    dots_size = 0.21
    dots_spacing = 0.32
    capslock_color = rgba(FFB74DFF)
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    font_family = $font_family
    placeholder_text = 輸入密碼
    fail_text = 密碼或指紋錯誤，請再試一次
    check_text = 正在驗證…
    rounding = 32
    fade_on_empty = true

    position = 0, 20
    halign = center
    valign = center
}

label { # Active PAM method: password prompt, then fingerprint fallback
    monitor =
    text = $PAMPROMPT
    color = rgba(d9e2ffCC)
    font_size = 20
    font_family = $font_family
    position = 0, -48
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = $text_color
    font_size = 24
    font_family = $font_family
    position = -30, 30
    halign = right
    valign = bottom
}

label { # Clock
    monitor =
    text = $TIME
    color = $text_color
    font_size = 122
    font_family = $font_family_clock

    position = 0, 340
    halign = center
    valign = center
}
label { # Date
    monitor =
    text = cmd[update:60000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/date.sh
    color = $text_color
    font_size = 36
    font_family = $font_family_clock

    position = 0, 248
    halign = center
    valign = center
}

label { # Live weather and near-term rain forecast
    monitor =
    text = cmd[update:600000] sh -c 'line=$(sed -n "1p" "${XDG_CACHE_HOME:-$HOME/.cache}/hyprlock/weather.txt" 2>/dev/null); test -n "$line" && printf "%s" "$line" || printf "目前位置 · 天氣資料讀取中"'
    color = $text_color
    font_size = 29
    font_family = $font_family
    position = 0, 183
    halign = center
    valign = center
}

label { # Weather details
    monitor =
    text = cmd[update:600000] sh -c 'line=$(sed -n "2p" "${XDG_CACHE_HOME:-$HOME/.cache}/hyprlock/weather.txt" 2>/dev/null); test -n "$line" && printf "%s" "$line" || printf "體感 -- · 濕度 -- · 風速 -- · 近 15 分鐘雨量 --"'
    color = $text_color
    font_size = 23
    font_family = $font_family
    position = 0, 138
    halign = center
    valign = center
}

label { # Weather context
    monitor =
    text = cmd[update:600000] sh -c 'line=$(sed -n "3p" "${XDG_CACHE_HOME:-$HOME/.cache}/hyprlock/weather.txt" 2>/dev/null); test -n "$line" && printf "%s" "$line" || printf "能見度 -- · 氣壓 -- · 日出 -- · 日落 -- · 更新 --"'
    color = rgba(d9e2ffCC)
    font_size = 19
    font_family = $font_family
    position = 0, 103
    halign = center
    valign = center
}

label { # Weather data attribution; deliberately non-interactive on the lock screen
    monitor =
    text = Weather data by Open-Meteo.com
    color = rgba(d9e2ff99)
    font_size = 14
    font_family = $font_family
    position = 0, 76
    halign = center
    valign = center
}

label { # User
    monitor =
    text =     $USER
    color = $text_color
    font_size = 33
    font_family = $font_family
    position = 0, 50
    halign = center
    valign = bottom
}

label { # Status
    monitor =
    text = cmd[update:60000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = $text_color
    font_size = 23
    font_family = $font_family

    position = 30, -30
    halign = left
    valign = top
}

# Weather-aware motion.  A single label updates only while Hyprlock exists;
# the frame helper uses bash built-ins and never performs a network request.
label {
    monitor =
    text = cmd[update:350] $HOME/.local/bin/hyprlock-weather-motion
    color = rgba(d9e2ff88)
    font_size = 95
    font_family = $font_family_weather
    position = 35%, 27%
    halign = center
    valign = center
}
