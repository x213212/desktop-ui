$lock_cmd = $HOME/.local/bin/secure-screen-lock
$session_lock_cmd = $HOME/.local/bin/secure-screen-lock --mark-session
$suspend_cmd = $HOME/.local/bin/uios-session-action suspend

general {
    lock_cmd = $lock_cmd
    # secure-lock-before-sleep.service is the sole PrepareForSleep owner.
    # Hypridle only waits for that owner's Wayland lock notification here.
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = $session_lock_cmd
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
